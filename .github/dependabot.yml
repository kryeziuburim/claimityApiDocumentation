version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # next and eslint-config-next must move together (listed first: a dependency joins the first matching group).
      nextjs:
        patterns: [next, eslint-config-next]
      # One PR for all other minor/patch updates; majors arrive individually so they can be reviewed on their own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors of the framework stack are upgraded deliberately, not by a bot.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
